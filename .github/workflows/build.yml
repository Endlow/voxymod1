name: Build mod
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build 1.20.1 Forge
        run: ./gradlew ":1.20.1-forge:build" --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: voxy-1.20.1-forge
          path: |
            versions/1.20.1-forge/build/libs/*.jar
            !versions/1.20.1-forge/build/libs/*-sources.jar
